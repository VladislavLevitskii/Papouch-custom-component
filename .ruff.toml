target-version = "py314"

exclude = [
    "tests"
]

[lint]
select = [
    "A001", "ASYNC", "B", "BLE", "C", "COM818", "D", "DTZ", "E", "F",
    "FLY", "FURB", "G", "I", "INP", "ISC", "ICN001", "LOG", "N",
    "PERF", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE",
    "RUF", "S", "SIM", "SLF", "SLOT", "T100", "T20", "TC", "TID",
    "TRY", "UP", "W"
]

# Ignorování pravidel podle Home Assistant Core
ignore = [
    "ASYNC109", "ASYNC110", "ASYNC240", "B008", "B019",
    "D202", "D203", "D212", "D213", "D406", "D407", "D417",
    "E501", "PLC1901", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
    "PLR0917", "PLR2004", "PLW0108", "PLW1641", "PLW2901", "PT011",
    "PT018", "RUF001", "RUF012", "RUF015", "RUF043", "SIM102", "SIM103",
    "SIM108", "SIM115", "TC001", "TC002", "TC003", "TC006", "TRY003",
    "TRY400", "UP047", "UP049", "W191", "E111", "E114", "E117", "D206",
    "D300", "Q", "COM812", "COM819", "PLE0605", "FURB116", "ISC004", "LOG004",
    "ISC001",
    "ANN401"
]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25
